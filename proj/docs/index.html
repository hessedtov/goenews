<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경기교육 주요 뉴스</title>
<style>
  :root{--ink:#12161c;--sub:#5b646f;--faint:#98a1ac;--paper:#fbfaf8;--card:#fff;
        --rule:#e3e0d8;--blue:#0e4da4;--soft:#eaf1fb;--line:#c6dbf5;--mark:#ffe27a;--warn:#a8321f;
        --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
        --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding:14px 20px 12px}
  .htop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .wordmark{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .wordmark b{color:var(--blue)}
  .tally{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .htools{margin-left:auto;display:flex;gap:8px;align-items:center}
  input[type=search]{width:280px;max-width:52vw;padding:8px 11px;border:1px solid var(--rule);
    border-radius:2px;background:var(--card);font:inherit;font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--soft)}
  .btn{padding:8px 12px;border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--sub);font:inherit;font-size:14px}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .wrap{display:grid;grid-template-columns:196px minmax(0,1fr)}
  aside{position:sticky;top:70px;max-height:calc(100vh - 70px);overflow:auto;padding:18px 14px 40px;border-right:1px solid var(--rule)}
  main{padding:22px 26px 80px;min-width:0}
  .rail-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);margin:0 0 8px}
  .issue{display:flex;gap:8px;width:100%;text-align:left;padding:5px 8px;border:0;background:none;
         border-radius:2px;color:var(--sub);font:inherit;font-size:13.5px;cursor:pointer}
  .issue:hover{background:var(--soft);color:var(--blue)}
  .issue.on{background:var(--ink);color:#fff;font-weight:600}
  .issue .d{font-family:var(--mono);font-size:12.5px}
  .issue .n{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.6}
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .head h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
  .head .meta{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .head .dl{margin-left:auto;display:flex;gap:6px}
  .sec-h{display:flex;align-items:center;gap:9px;margin:26px 0 2px}
  .sec-h .sq{color:var(--blue);font-size:11px}
  .sec-h h2{font-size:15px;font-weight:800;margin:0}
  .sec-h .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .note{font-size:12px;color:var(--faint);margin:0 0 4px 20px}
  .rule{border-top:1.5px dotted var(--line);margin:6px 0 2px}
  .row{display:flex;gap:14px;align-items:baseline;padding:7px 6px 7px 20px;border-bottom:1px solid var(--rule)}
  .row:hover{background:var(--card)}
  .row .t{flex:1;min-width:0;font-size:14.5px}
  .row a.t:hover,.row .t a:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
  .row .src{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
  .row .src b{color:var(--sub);font-family:var(--sans);font-size:12px;font-weight:600}
  .rel{margin:-2px 0 6px 20px;font-size:11.5px;color:var(--faint)}
  .hl{display:flex;gap:12px;padding:6px 6px 6px 20px;border-bottom:1px solid var(--rule)}
  .hl .p{flex:none;width:78px;font-size:12.5px;font-weight:700;color:var(--blue)}
  .hl .t{flex:1;font-size:14px;color:var(--sub)}
  .approx{font-size:10.5px;color:var(--warn);margin-left:5px}
  .tag{display:inline-block;margin-right:7px;padding:1px 6px;border-radius:2px;background:var(--soft);color:var(--blue);font-size:11px}
  .res-day{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:18px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
  mark{background:var(--mark);padding:0 1px}
  .empty{padding:60px 20px;text-align:center;color:var(--faint)}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
    main{padding:18px 16px 60px}.row,.hl{padding-left:6px}.rel{margin-left:6px}}
</style>

<header>
  <div class="htop">
    <div class="wordmark">경기교육 <b>주요 뉴스</b></div>
    <div class="tally" id="tally">불러오는 중…</div>
    <div class="htools">
      <input type="search" id="q" placeholder="전체 기간 검색" autocomplete="off">
    </div>
  </div>
</header>

<div class="wrap">
  <aside><p class="rail-h">발행일</p><div id="issues"></div></aside>
  <main id="main"><div class="empty">불러오는 중…</div></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WEEK='일월화수목금토', HEADLINE='주요언론 헤드라인';
let INDEX=[], FLAT=[], cache={}, cur=null, q='';

const fmt = d => { const [y,m,dd]=d.split('-').map(Number);
  return `${m}월 ${dd}일 (${WEEK[new Date(y,m-1,dd).getDay()]})`; };
const hi = (s,k) => k ? esc(s).replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>') : esc(s);

async function boot(){
  try{
    INDEX = await (await fetch('data/index.json',{cache:'no-cache'})).json();
    FLAT  = await (await fetch('data/search.json',{cache:'no-cache'})).json();
  }catch(e){
    $('#main').innerHTML='<div class="empty"><b>아직 발행본이 없습니다</b>'+
      'Actions 탭에서 «경기교육 뉴스 수집» 을 한 번 실행하면 채워집니다.</div>';
    $('#tally').textContent=''; return;
  }
  $('#tally').textContent = `${INDEX.length}일 · 기사 ${FLAT.length.toLocaleString()}건`;
  rail(); show(INDEX[0]?.issue);
}

function rail(){
  $('#issues').innerHTML = INDEX.map(i=>`<button class="issue ${!q&&cur===i.issue?'on':''}" data-d="${i.issue}">
    <span class="d">${i.issue.slice(5).replace('-','.')}</span>
    <span>${WEEK[new Date(i.issue).getDay()]}</span><span class="n">${i.n}</span></button>`).join('');
}

async function show(day){
  if(!day) return;
  cur=day; q=''; $('#q').value=''; rail();
  if(!cache[day]) cache[day] = await (await fetch(`data/${day}.json`,{cache:'no-cache'})).json();
  const iss = cache[day];
  const n = iss.sections.reduce((a,s)=>a+s.items.length,0);
  $('#main').innerHTML = `<div class="head"><h1>${fmt(day)}</h1>
      <span class="meta">${day} · 기사 ${n}건</span>
      <span class="dl"><a class="btn" href="issue/${day}.html" target="_blank">지면</a>
      <a class="btn" href="issue/${day}.pdf" target="_blank">PDF</a></span></div>` +
    iss.sections.map(s=>`
      <div class="sec-h"><span class="sq">■</span><h2>${esc(s.name)}</h2><span class="cnt">${s.items.length}</span></div>
      ${s.note?`<p class="note">(${esc(s.note)})</p>`:''}<div class="rule"></div>
      ${s.items.map(it=>{
        const t = it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title);
        if(s.name===HEADLINE) return `<div class="hl"><span class="p">${esc(it.press)}</span>
          <span class="t">${t}${it.approx?'<span class="approx">추정</span>':''}</span></div>`;
        return `<div class="row"><span class="t">${t}</span>
          <span class="src"><b>${esc(it.press||'')}</b> ${esc((it.date||'').replace(/-/g,'.'))}</span></div>` +
          (it.related?.length?`<div class="rel">관련 ${esc(it.related.join(', '))}</div>`:'');
      }).join('')}`).join('');
}

function search(){
  const k=q.toLowerCase();
  const hits=FLAT.filter(r=>(r[2]+' '+r[3]).toLowerCase().includes(k));
  const byDay={};
  hits.forEach(r=>(byDay[r[0]]=byDay[r[0]]||[]).push(r));
  $('#main').innerHTML = `<div class="head"><h1>검색</h1>
      <span class="meta">${hits.length}건 · “${esc(q)}”</span></div>` +
    (hits.length?Object.keys(byDay).sort().reverse().map(d=>`
      <div class="res-day">${d.replace(/-/g,'.')} · ${byDay[d].length}건</div>
      ${byDay[d].map(r=>`<div class="row"><span class="t"><span class="tag">${esc(r[1].replace('[기획기사] ',''))}</span>
        ${r[5]?`<a href="${esc(r[5])}" target="_blank" rel="noopener">${hi(r[2],q)}</a>`:hi(r[2],q)}</span>
        <span class="src"><b>${esc(r[3])}</b> ${esc((r[4]||'').replace(/-/g,'.'))}</span></div>`).join('')}
    `).join(''):'<div class="empty">검색어를 바꿔 보세요.</div>');
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-d]'); if(b) show(b.dataset.d);});
$('#q').addEventListener('input',e=>{q=e.target.value.trim(); rail(); q?search():show(cur);});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'){$('#q').value='';q='';show(cur);}
});
boot();
</script>

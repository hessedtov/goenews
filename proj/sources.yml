    도메인: khan.co.kr
    주요: https://www.khan.co.kr/rss/rssdata/total_news.xml
    오피니언: https://www.khan.co.kr/rss/rssdata/opinion_news.xml
  국민일보:
    도메인: kmib.co.kr
    주요: http://rss.kmib.co.kr/data/kmibHotNewsRss.xml
    오피니언: http://rss.kmib.co.kr/data/kmibColumnRss.xml
  동아일보:
    도메인: donga.com
    주요: https://rss.donga.com/total.xml
    오피니언: https://rss.donga.com/editorials.xml
  서울신문:
    도메인: seoul.co.kr
    주요: https://www.seoul.co.kr/xml/rss/rss_society.xml
    오피니언: https://www.seoul.co.kr/xml/rss/rss_opinion.xml
  세계일보:
    도메인: segye.com
    주요: https://www.segye.com/Articles/RSSList/segye_recent.xml
    오피니언: https://www.segye.com/Articles/RSSList/segye_opinion.xml
  조선일보:
    도메인: chosun.com
    주요: https://www.chosun.com/arc/outboundfeeds/rss/
    오피니언: https://www.chosun.com/arc/outboundfeeds/rss/category/opinion/
  중앙일보:
    도메인: joongang.co.kr
    주요: https://rss.joins.com/joins_news_list.xml
    오피니언: https://rss.joins.com/joins_opinion_list.xml
  한겨레:
    도메인: hani.co.kr
    주요: https://www.hani.co.kr/rss/
    오피니언: https://www.hani.co.kr/rss/opinion/
  한국일보:
    도메인: hankookilbo.com
    주요: https://rss.hankooki.com/news/hk_main.xml
    오피니언: https://rss.hankooki.com/news/hk_opinion.xml

# 1면 헤드라인을 추정할 시간대 (조간 마감 직후)
헤드라인_시간대: [0, 8]

# ── 구글 뉴스 검색 (키 없이 무료) ────────────────────────────
#  통신사(연합·뉴시스·뉴스1)와 방송사는 이쪽으로 들어옵니다.
구글뉴스:
  틀: 'https://news.google.com/rss/search?q={q}&hl=ko&gl=KR&ceid=KR:ko'
  질의:
    경기도교육청:
      - '경기도교육청 when:2d'
      - '경기교육청 when:2d'
      - '안민석 교육감 when:2d'
      - '경기교육 대전환 when:2d'
      - '폰 프리 스쿨 when:2d'
      - '교권보호국 OR 교권보호전담관 when:2d'
    교육계:
      - '교육교부금 when:2d'
      - '교육부 when:1d'
      - '교권 침해 when:2d'
      - '학교 폭력 OR 학생부 when:2d'
      - '국가교육위원회 when:2d'
      - '고교학점제 OR 늘봄학교 when:2d'
      - '시도교육감협의회 when:2d'
    교육지원청:
      - '교육지원청 경기 when:2d'

# ── 경기도교육청 보도자료 (정책 원문 대조용) ──────────────────
보도자료:
  경기도교육청: https://www.goe.go.kr/home/bbs/bbsRss.do?bbsId=BBSMSTR_000000000001


# ─────────────────────────────────────────────────────────────
#  경기교육 주요 뉴스 · 수집 설정
#  고쳐야 할 일이 생기면 대부분 이 파일만 손보면 됩니다.
#  피드 주소가 맞는지 확인하려면:  python discover.py
# ─────────────────────────────────────────────────────────────

발행:
  이름: 경기교육 주요 뉴스
  표준시: Asia/Seoul
  # 월요일은 금·토·일 사흘치를 함께 담습니다 (원본 편집 관행)
  주말_소급일수: 3
  평일_소급일수: 1

# ── 경기권 지역지 ────────────────────────────────────────────
#  지원청·학교 소식과 기획 지면은 통신사에 거의 안 나옵니다.
#  이 여섯 곳이 그 섹션의 90%를 담당합니다.
지역지:
  경기일보:
    도메인: kyeonggi.com
    피드:
      전체: https://www.kyeonggi.com/rss/allArticle.xml
      교육: https://www.kyeonggi.com/rss/S1N5.xml
      오피니언: https://www.kyeonggi.com/rss/S1N9.xml
    기획지면: ['꿈꾸는 경기교육']
  중부일보:
    도메인: joongboo.com
    피드:
      전체: https://www.joongboo.com/rss/allArticle.xml
    기획지면: ['교육이 미래다']
  경기신문:
    도메인: kgnews.co.kr
    피드:
      전체: https://www.kgnews.co.kr/rss/allArticle.xml
    기획지면: ['경기 교육', '경기교육이 미래다']
  인천일보:
    도메인: incheonilbo.com
    피드:
      전체: https://www.incheonilbo.com/rss/allArticle.xml
    기획지면: ['새로운 경기교육', '경기교육 대전환']
  기호일보:
    도메인: kihoilbo.co.kr
    피드:
      전체: https://www.kihoilbo.co.kr/rss/allArticle.xml
      교육: https://www.kihoilbo.co.kr/rss/S1N6.xml
      오피니언: https://www.kihoilbo.co.kr/rss/S1N11.xml
    기획지면: ['모두가 행복한 경기교육 대전환']
  경인일보:
    도메인: kyeongin.com
    피드:
      전체: https://www.kyeongin.com/rss/allArticle.xml
    기획지면: ['에듀 경기']

# ── 중앙 종합지 9종 (헤드라인 + 사설) ────────────────────────
#  주요: 1면 머릿기사 추정에 쓰는 종합 피드 (그날 새벽에 올라온 첫 기사)
#  오피니언: 사설·칼럼 섹션용
종합지:

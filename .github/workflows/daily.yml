name: 경기교육 뉴스 수집

on:
  schedule:
    # 매일 오전 7시 10분 (KST) = 전날 22:10 UTC
    - cron: '10 22 * * 0-4'
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜로 다시 만들기 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      check_only:
        description: '수집하지 않고 피드 점검만'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements.txt

      - name: 피드 점검
        run: python discover.py

      - name: 뉴스 수집
        if: ${{ github.event.inputs.check_only != 'true' }}
        run: python collect.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: 지면 만들기 (HTML + PDF)
        if: ${{ github.event.inputs.check_only != 'true' }}
        run: python render.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: 결과 저장
        if: ${{ github.event.inputs.check_only != 'true' }}
        run: |
          git config user.name  'news-bot'
          git config user.email 'news-bot@users.noreply.github.com'
          git add docs
          git diff --staged --quiet || git commit -m "뉴스 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event.inputs.check_only != 'true' }}
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ github.event.inputs.check_only != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
